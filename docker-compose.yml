name: city-complaint

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: citycomplaintsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d citycomplaintsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  complaint-service:
    build:
      context: ./backend/services/complaint-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=citycomplaintsdb;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

  admin-service:
    build:
      context: ./backend/services/admin-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=citycomplaintsdb;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8080"

  progress-service:
    build:
      context: ./backend/services/progress-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=citycomplaintsdb;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8083:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - complaint-service
      - admin-service
      - progress-service
    ports:
      - "4200:80"

volumes:
  pgdata:
