name: ${COMPOSE_PROJECT_NAME}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT}:${DB_INTERNAL_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  complaint-service:
    build:
      context: ./backend/services/complaint-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV}
      ConnectionStrings__DefaultConnection: Host=db;Port=${DB_INTERNAL_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${COMPLAINT_PORT}:8080"
    networks:
      - backend-network

  admin-service:
    build:
      context: ./backend/services/admin-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV}
      ConnectionStrings__DefaultConnection: Host=db;Port=${DB_INTERNAL_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT}:8080"
    networks:
      - backend-network

  progress-service:
    build:
      context: ./backend/services/progress-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV}
      ConnectionStrings__DefaultConnection: Host=db;Port=${DB_INTERNAL_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PROGRESS_PORT}:8080"
    networks:
      - backend-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - complaint-service
      - admin-service
      - progress-service
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - backend-network

volumes:
  pgdata:

networks:
  backend-network:
    driver: bridge