name: CI/CD

on:
  push:
    branches: [dev]

permissions:
  contents: read

env:
  ECR_BASE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/city-complaint

jobs:

  # Build & push all 3 backend services in parallel
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: complaint-service
            project:  ComplaintService
          - service: admin-service
            project:  AdminService
          - service: progress-service
            project:  ProgressService

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Test
        run: |
          dotnet build backend/services/${{ matrix.service }}/${{ matrix.project }}.csproj -c Release
          dotnet test  backend/services/${{ matrix.service }} -c Release --no-build || true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: backend/services/${{ matrix.service }}
          push:    true
          tags: |
            ${{ env.ECR_BASE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_BASE }}/${{ matrix.service }}:dev
          cache-from: type=gha
          cache-to:   type=gha,mode=max


  # Build & push the Angular frontend
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push:    true
          tags: |
            ${{ env.ECR_BASE }}/frontend:${{ github.sha }}
            ${{ env.ECR_BASE }}/frontend:dev
          cache-from: type=gha
          cache-to:   type=gha,mode=max


  # Rolling deploy to the kubeadm K8s cluster
  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: azure/setup-kubectl@v3

      - name: Write kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > $HOME/.kube/config

      - name: Rolling update
        run: |
          ECR=${{ env.ECR_BASE }}
          SHA=${{ github.sha }}

          kubectl set image deployment/complaint-service complaint-service=${ECR}/complaint-service:${SHA}
          kubectl set image deployment/admin-service     admin-service=${ECR}/admin-service:${SHA}
          kubectl set image deployment/progress-service  progress-service=${ECR}/progress-service:${SHA}
          kubectl set image deployment/frontend          frontend=${ECR}/frontend:${SHA}

          kubectl rollout status deployment/complaint-service --timeout=120s
          kubectl rollout status deployment/admin-service     --timeout=120s
          kubectl rollout status deployment/progress-service  --timeout=120s
          kubectl rollout status deployment/frontend          --timeout=120s